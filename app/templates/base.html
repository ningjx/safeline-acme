<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}雷池 ACME 证书助手{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="topnav">
  <div class="brand">🔐 Safeline ACME</div>
  <div class="links">
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == '/' }}">总览</a>
    <a href="{{ url_for('certs_page') }}" class="{{ 'active' if request.path == '/certs' }}">证书管理</a>
    <a href="{{ url_for('config_page') }}" class="{{ 'active' if request.path == '/config' }}">配置</a>
    <a href="{{ url_for('logs_page') }}" class="{{ 'active' if request.path == '/logs' }}">日志</a>
  </div>
  <div class="links right">
    {% if credentials_ok %}<span class="env-ok">凭据已配置</span>
    {% else %}<a href="{{ url_for('config_page') }}" class="env-bad">⚠ 凭据未配置</a>{% endif %}
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
